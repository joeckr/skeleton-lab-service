[tools]
betterleaks = "latest"
"go:github.com/google/addlicense" = "v1.2.0"
trivy = "v0.74.0"
helm = "v3.14.0"
actionlint = "v1.7.1"
shellcheck = "latest"
zizmor = "latest"
hk = "latest"
pkl = "latest"
tombi = "latest"
yamllint = "latest"

[tasks.install]
description = "Install tools, hook up hooks, and prepare environment"
run = """
hk install --mise
"""

[tasks.compose]
description = "Run Docker Compose for local lab"
run = """
docker compose up -d
"""

[tasks.down]
description = "Stop Docker Compose"
run = """
docker compose down
"""

[tasks.logs]
description = "View Docker Compose logs"
run = """
docker compose logs -f
"""

[tasks.hk]
description = "Run hk checks on all files"
alias = "check"
run = """
hk check --all
"""

[tasks.helm-lint]
description = "Lint Helm chart"
run = """
helm lint chart/
"""

[tasks.helm-template]
description = "Render Helm chart templates"
run = """
helm template lab-service chart/
"""

[tasks.trivy-fs]
description = "Run Trivy on the file system"
run = """
trivy fs .
"""
